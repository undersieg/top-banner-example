name: top_banner_workspace
description: >-
  Repository root. The banner core, the go_router adapter, and the demo app are
  three separate packages, wired by path dependency rather than by a shared
  resolution, so the dependency direction is enforced by the compiler: top_banner
  cannot resolve `package:go_router` at all.
publish_to: 'none'

environment:
  sdk: ^3.11.3

# Nothing is built from here. This is only so `flutter analyze` and
# `dart format` can be run over the whole repo, and so the root
# analysis_options.yaml can resolve its include.
dev_dependencies:
  flutter_lints: ^6.0.0
