name: top_banner_example
description: "Demo app for the top_banner package: markers at every shell depth."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # No go_router. The app names no routing-library type, so it does not need
  # the dependency — and cannot acquire one by accident.
  core_navigation:
    path: ../packages/core_navigation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: 3.0.10

flutter:
  uses-material-design: true
